<!DOCTYPE html>
<html>
<head>
<title>For DOLA ❤️</title>
<style>
body{background:#000;color:#fff;font-family:Poppins;text-align:center}
#lockScreen{position:fixed;width:100%;height:100%;background:pink;display:flex;justify-content:center;align-items:center;z-index:999}
.lock-box{background:rgba(255,255,255,0.2);padding:30px;border-radius:20px}
.hidden{display:none}
.gallery{width:300px;height:300px;margin:20px auto;border:3px solid #ff4d6d;border-radius:20px;overflow:hidden;position:relative}
.gallery img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0;transition:1s}
.gallery img.active{opacity:1}
#openBtn{padding:15px 30px;background:#ff4d6d;color:#fff;border:none;border-radius:50px;font-size:18px;cursor:pointer}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lockScreen">
  <div class="lock-box">
    <h2>🔒 Passcode: 8080</h2>
    <input type="password" id="passInput">
    <button id="unlockBtn">Unlock</button>
  </div>
</div>

<!-- MAIN -->
<div id="mainContent" class="hidden">
  <h1>Happy Anniversary DOLA & RIYAJ ❤️</h1>
  <button id="openBtn">Open My Heart 💌</button>

  <div id="letter" class="hidden">
    <p>Dear DOLA... I love you forever ❤️</p>
    <!-- PIC এখানে -->
    <div class="gallery" style="width:300px; height:300px; margin:20px auto; border:3px solid #ff4d6d; border-radius:20px; overflow:hidden; position:relative;">
  <img src="images/IMG-20260728-WA0004.jpg" class="active" style="position:absolute; width:100%; height:100%; object-fit:cover; opacity:1; transition:1s;">
  <img src="images/IMG-20260728-WA0005.jpg" style="position:absolute; width:100%; height:100%; object-fit:cover; opacity:0; transition:1s;">
    </div>
    <h3 id="counter"></h3>
  </div>
</div>

<script>
// 1. Passcode 8080
document.getElementById('unlockBtn').onclick = function(){
  if(document.getElementById('passInput').value === "8080"){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('mainContent').classList.remove('hidden');
    startSlideshow(); startCounter();
  }
}
// 2. Open Letter
document.getElementById('openBtn').onclick = function(){
  document.getElementById('letter').classList.remove('hidden');
  this.style.display='none';
}
// 3. Counter
function startCounter(){
  let start = new Date("2022-09-21");
  setInterval(()=>{
    let diff = Math.floor((new Date()-start)/86400000);
    document.getElementById('counter').innerText = diff + " Days Together ❤️";
  },1000);
}
// 4. 10 sec পর Pic Change
let i=0;
function startSlideshow(){
  let pics = document.querySelectorAll('.gallery img');
  setInterval(()=>{
    pics[i].classList.remove('active');
    i = (i+1) % pics.length;
    pics[i].classList.add('active');
  },10000);
}
</script>
</body>
</html>
