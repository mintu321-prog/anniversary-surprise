<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Anniversary ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
  body{background:#000;color:#fff;overflow-x:hidden;text-align:center}

  /* LOCK SCREEN */
  #lockScreen{position:fixed; top:0; left:0; width:100%; height:100%;background:linear-gradient(135deg,#ff4d6d,#ff8fa3);display:flex; justify-content:center; align-items:center; z-index:9999;}
  .lock-box{background:rgba(255,255,255,0.15); backdrop-filter:blur(15px);padding:40px; border-radius:20px; color:#fff;border:1px solid rgba(255,255,255,0.3);}
  .lock-box input{padding:12px; font-size:18px; border:none; border-radius:10px;text-align:center; margin:15px 0; width:200px;}
  .lock-box button{background:#fff; color:#ff4d6d; border:none; padding:12px 30px;border-radius:10px; font-size:16px; font-weight:700; cursor:pointer;}
  #errorMsg{color:yellow; margin-top:10px; display:none}
  
  .hidden{display:none}
  .hero{padding:100px 20px}
  .hero h1{font-size:40px;color:#ff4d6d}
  #openBtn{background:#ff4d6d;color:#fff;border:none;padding:15px 30px;border-radius:50px;font-size:18px;cursor:pointer;margin-top:20px}
  #letter{padding:50px 20px}

  /* GALLERY WITH FADE */
  .gallery{width:90%; max-width:350px; height:350px; margin:20px auto;border-radius:20px;overflow:hidden;position:relative;border:3px solid #ff4d6d; background:#222;}
  .gallery img{position:absolute; width:100%; height:100%; object-fit:cover; transition: opacity 1s ease-in-out; opacity: 0;}
  .gallery img.active{opacity:1} /* শুধু active টা দেখাবে */

  /* HEARTS */
  .hearts{position:fixed; width:100%; height:100%; top:0; left:0; pointer-events:none; z-index:1}
  .heart{position:absolute;width:20px;height:20px;background:red;transform:rotate(45deg);animation:float 6s infinite linear}
  .heart:before,.heart:after{content:'';width:20px;height:20px;position:absolute;border-radius:50%;background:red}
  .heart:before{top:-10px}.heart:after{left:-10px}
  @keyframes float{0%{bottom:-20px;opacity:1}100%{bottom:100%;opacity:0}}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <h2>🔒 Secret Surprise</h2>
    <p>Only For DOLA ❤️</p>
    <input type="password" id="passInput" placeholder="Enter Passcode 8080" maxlength="4">
    <button id="unlockBtn">Unlock</button>
    <p id="errorMsg">Wrong Code! Try 8080</p>
  </div>
</div>

<div class="hearts"></div>

<div id="mainContent" class="hidden">
  <section class="hero">
    <h1>Happy Anniversary ❤️</h1>
    <h2>DOLA & RIYAJ</h2>
    <button id="openBtn"> Open My Heart 💌 </button>
  </section>

  <section id="letter" class="hidden">
    <h1>For My Love ❤️</h1>
    <p> Dear DOLA, <br><br> Every heartbeat reminds me of you. <br> Thank you for making my life beautiful. <br> No matter what happens, I promise to love you forever. <br><br> Happy Anniversary ❤️ </p>

    <div class="gallery">
      <img src="images/IMG-20260728-WA0004.jpg" id="slider" class="active">
      <img src="images/IMG-20260728-WA0005.jpg" id="slider2">
    </div>
    <h3 id="counter"></h3>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
