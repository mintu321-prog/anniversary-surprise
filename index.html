<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>For My DOLA ❤️</title>
<style>
  body{margin:0;background:#000;color:#fff;font-family:'Hind Siliguri',sans-serif;overflow:hidden}
  /* লোডিং */
  #loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#ff4d6d;display:flex;justify-content:center;align-items:center;font-size:24px;z-index:999}
  /* ভাসমান হার্ট */
  .heart{position:fixed;width:20px;height:20px;background:red;transform:rotate(45deg);animation:float 6s infinite}
  .heart:before,.heart:after{content:'';width:20px;height:20px;position:absolute;border-radius:50%;background:red}
  .heart:before{top:-10px}.heart:after{left:-10px}
  @keyframes float{0%{bottom:-20px;opacity:1}100%{bottom:100%;opacity:0}}
  /* গ্লাস কার্ড */
  .glass{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);padding:20px;border-radius:20px;text-align:center}
</style>
</head>
<body>
<div id="loading">Loading Our Love... ❤️</div>

<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="glass">
  <h1>I Love You DOLA</h1>
  <p>21 সেপ্টেম্বর 2022 থেকে <span id="counter"></span> দিন</p>
  <button onclick="document.getElementById('bgm').play()">🎵 Music On</button>
</div>

<script>
  // লোডিং হাইড
  setTimeout(()=>document.getElementById('loading').style.display='none',3000)
  
  // কাউন্টার
  let start = new Date("2022-09-21");
  setInterval(()=>{
    let diff = Math.floor((new Date()-start)/86400000)
    document.getElementById('counter').innerText = diff
  },1000)
  
  // ভাসমান হার্ট
  setInterval(()=>{
    let h = document.createElement('div');
    h.className='heart';
    h.style.left = Math.random()*100+'%';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000)
  },300)
</script>
</body>
</html>
