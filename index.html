<body>

<!-- LOCK -->
<div id="lockScreen">
  <div class="lock-box">
    <h2>🔒 Passcode: 8080</h2>
    <input type="password" id="passInput">
    <button id="unlockBtn">Unlock</button>
  </div>
</div>

<!-- MAIN -->
<div id="mainContent" class="hidden">
  <h1>Happy Anniversary DOLA & RIYAJ ❤️</h1>
  <button id="openBtn">Open My Heart 💌</button>

  <div id="letter" class="hidden">
    <p>Dear DOLA... I love you forever ❤️</p>
    <!-- PIC এখানে -->
    <div class="gallery">
  <img src="images/IMG-20260728-WA0004.jpg" id="slider">
    </div>
    <h3 id="counter"></h3>
  </div>
</div>

<script>
// 1. Passcode 8080
document.getElementById('unlockBtn').onclick = function(){
  if(document.getElementById('passInput').value === "8080"){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('mainContent').classList.remove('hidden');
    startSlideshow(); startCounter();
  }
}
// 2. Open Letter
document.getElementById('openBtn').onclick = function(){
  document.getElementById('letter').classList.remove('hidden');
  this.style.display='none';
}
// 3. Counter
function startCounter(){
  let start = new Date("2022-09-21");
  setInterval(()=>{
    let diff = Math.floor((new Date()-start)/86400000);
    document.getElementById('counter').innerText = diff + " Days Together ❤️";
  },1000);
}
// 4. 10 sec পর Pic Change
let i=0;
function startSlideshow(){
  let pics = document.querySelectorAll('.gallery img');
  setInterval(()=>{
    pics[i].classList.remove('active');
    i = (i+1) % pics.length;
    pics[i].classList.add('active');
  },10000);
}
</script>
