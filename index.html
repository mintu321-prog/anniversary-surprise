<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Anniversary ❤️</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ধাপ 1: LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-box">
    <h2>🔒 Secret Surprise</h2>
    <p>Only For DOLA ❤️</p>
    <input type="password" id="passInput" placeholder="Enter Passcode" maxlength="4">
    <button onclick="checkPass()">Unlock</button>
    <p id="errorMsg">Wrong Code! Try 8080</p>
  </div>
</div>

<div class="hearts"></div>

<!-- ধাপ 2: MAIN CONTENT - প্রথমে লুকানো -->
<div id="mainContent" class="hidden">
  <section class="hero">
    <h1>Happy Anniversary ❤️</h1>
    <h2>DOLA & RIYAJ</h2>
    <p id="typing"></p>
    <button id="openBtn"> Open My Heart 💌 </button>
  </section>

  <section id="letter" class="hidden">
    <h1>For My Love ❤️</h1>
    <p> 
      Dear DOLA, <br><br>
      Every heartbeat reminds me of you. <br>
      Thank you for making my life beautiful. <br>
      No matter what happens, I promise to love you forever. <br><br>
      Happy Anniversary ❤️
    </p>
    <div class="gallery">
      <img src="images/IMG-20260728-WA0004.jpg" id="slider">
    </div>
    <h3 id="counter"></h3>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
